[project]
name = "scaffold-gs-nerfstudio"
description = "Scaffold-GS extension for nerfstudio."
version = "0.0.0"
dependencies = [
  "einops",
  "gsplat @ git+https://github.com/brian-xu/gsplat-rade.git",
  "nerfstudio >= 1.1.5",
  "numpy == 1.26.4",
]

[project.entry-points."nerfstudio.method_configs"]
scaffold-gs = "scaffold_gs.scaffold_gs_config:scaffold_gs"
gsdf = "scaffold_gs.scaffold_gs_config:gsdf"
neus-acc = "scaffold_gs.scaffold_gs_config:neus_acc"

[tool.setuptools.packages.find]
include = ["scaffold_gs*"]
